name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.15.20
      - name: Ruff check
        run: ruff check .

  audit:
    # 依赖漏洞扫描：先观察模式（不阻塞 CI）。已知通告：soupsieve/torch/urllib3
    # 传递依赖旧版被钉。复评期限 2026-12：评估升级路径后对 Critical/High
    # 去掉 continue-on-error 转硬闸门。
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e . -c constraints.txt pip-audit
      - name: pip-audit
        run: pip-audit --skip-editable

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # pandas 3.x / numpy 2.4+ 已不支持 3.10，且 3.11 是声明的最低版本
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt
      - name: Install project
        # tests/backend imports fastapi/sqlalchemy/alembic directly; the base
        # install alone cannot even collect them. TestClient also needs httpx.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[backend]" -c constraints.txt pytest httpx
      - name: Check dependency consistency
        run: python -m pip check
      - name: Run tests
        shell: bash
        # pytest only fails the step; surfacing FAILED lines as annotations makes
        # a platform-only failure diagnosable without admin log rights.
        run: |
          set -o pipefail
          set +e  # the runner's bash uses -e; keep the failure branch reachable
          python -m pytest tests/ -q --tb=line 2>&1 | tee pytest.log
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error title=pytest-exit::status=${status} log_lines=$(wc -l < pytest.log)"
            grep -E "^(FAILED|ERROR) " pytest.log | while IFS= read -r line; do
              echo "::error title=pytest::${line}"
            done
            # A crash (segfault/OOM) leaves no FAILED summary; the tail is the
            # only evidence that survives into the public annotations API.
            tail -n 30 pytest.log | while IFS= read -r line; do
              echo "::error title=pytest-tail::${line}"
            done
            {
              echo "### pytest failures"
              grep -E "^(FAILED|ERROR) " pytest.log || true
              tail -n 60 pytest.log
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
        env:
          PYTHONFAULTHANDLER: "1"
          # conftest.py mocks keys, but keep CI hermetic just in case
          DEEPSEEK_API_KEY: test-key
          OPENAI_API_KEY: test-key
          ANTHROPIC_API_KEY: test-key

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check and build
        run: npm run build
      - name: Bundle budget
        run: npm run check:bundle -- --out "$RUNNER_TEMP/bundle.json"
      - name: Unit tests
        run: npm test
