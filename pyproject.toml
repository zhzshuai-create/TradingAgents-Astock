[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tradingagents-astock"
version = "0.2.19"
description = "A股多Agent投研框架 — 基于 TradingAgents 深度特化"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "simonlin1212", email = "simonlin1212@users.noreply.github.com"},
]
dependencies = [
    "langchain-core>=0.3.81",
    "langchain-anthropic>=0.3.15",
    "langchain-openai>=0.3.23",
    "langgraph>=0.4.8",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "pandas>=2.3.0",
    "parsel>=1.10.0",
    "plotly>=6.0.0",
    "pytz>=2025.2",
    "questionary>=2.1.0",
    "requests>=2.32.4",
    "rich>=14.0.0",
    "typer>=0.21.0",
    "setuptools>=80.9.0",
    "stockstats>=0.6.5",
    "tqdm>=4.67.1",
    "typing-extensions>=4.14.0",
    "yfinance>=0.2.63",
    "streamlit>=1.45.0",
    "streamlit-autorefresh>=1.0.0",
    "fpdf2>=2.8.6",
    "python-dotenv>=1.1.0",
    "mootdx>=0.10.0",
]

[project.urls]
Homepage = "https://github.com/zhzshuai-create/TradingAgents-Astock"
Repository = "https://github.com/zhzshuai-create/TradingAgents-Astock"
Issues = "https://github.com/zhzshuai-create/TradingAgents-Astock/issues"
Upstream = "https://github.com/TauricResearch/TradingAgents"
AstockFork = "https://github.com/simonlin1212/TradingAgents-astock"

[project.optional-dependencies]
google = ["langchain-google-genai>=4.0.0"]

[project.scripts]
tradingagents = "cli.main:app"
tradingagents-web = "web.launch:main"

[tool.setuptools.packages.find]
include = ["tradingagents*", "cli*", "web*"]

[tool.setuptools.package-data]
cli = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: fast isolated unit tests",
    "integration: tests requiring external services",
    "smoke: quick sanity-check tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff.lint.per-file-ignores]
# 刻意的 E402（import 顺序是功能性的，勿"修复"）：
# - cli/main.py: load_dotenv() 必须先于 langchain/tradingagents 导入（读取环境变量）
# - web/app.py: 启动性能优化，重导入刻意下沉到 set_page_config/遮罩之后
# - 各入口/工具脚本: sys.path 注入先于包导入
"cli/main.py" = ["E402"]
"web/app.py" = ["E402"]
"run_deepseek.py" = ["E402"]
"scan_sectors.py" = ["E402"]
"test_data_quality.py" = ["E402"]
"examples/*" = ["E402"]
"tools/*" = ["E402"]
"experiments/*" = ["E402"]
"scripts/*" = ["E402"]
