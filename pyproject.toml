[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tradingagents-astock"
version = "0.2.19"
description = "A股多Agent投研框架 — 基于 TradingAgents 深度特化"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "zhzshuai-create", email = "zhzshuai-create@users.noreply.github.com"},
]
dependencies = [
    "langchain-core>=1.6.12,<2",
    "langchain-anthropic>=1.7.6,<2",
    "langchain-openai>=1.7.2,<2",
    "langgraph>=1.2.16,<2",
    "langgraph-checkpoint-sqlite>=3.1.2,<4",
    "matplotlib>=3.11.2,<4",
    "pandas>=3.0.6,<4",
    "parsel>=1.12.1,<2",
    "plotly>=7.1.0,<8",
    "pytz>=2026.5",
    "questionary>=2.1.1,<3",
    "requests>=2.34.2,<3",
    "curl_cffi>=0.16.3,<1",
    "rich>=15.0.0,<16",
    "typer>=0.27.3,<1",
    "setuptools>=84.0.0",
    "stockstats>=0.6.9,<1",
    "tqdm>=4.70.1,<5",
    "typing-extensions>=4.16.0",
    "yfinance>=1.7.0,<2",
    "streamlit>=1.66.0,<2",
    "streamlit-autorefresh>=1.0.1,<2",
    "fpdf2>=2.8.9,<3",
    "python-dotenv>=1.2.4,<2",
    "mootdx>=0.11.7,<0.12",
]

[project.urls]
Homepage = "https://github.com/zhzshuai-create/TradingAgents-Astock"
Repository = "https://github.com/zhzshuai-create/TradingAgents-Astock"
Issues = "https://github.com/zhzshuai-create/TradingAgents-Astock/issues"
Upstream = "https://github.com/TauricResearch/TradingAgents"
AstockFork = "https://github.com/simonlin1212/TradingAgents-astock"

[project.optional-dependencies]
# Gemini 依赖与 mootdx 的 httpx<0.26 结构性冲突，不再提供 [google] extra。
# 需要 Gemini 时单独建 venv，见 README「Google Gemini」。
scripts = ["akshare"]  # 仅 scan_sectors.py 独立脚本使用
# 巨潮公告 PDF 全文提取（get_announcements）；未安装时自动降级为仅公告列表
announcements = ["markitdown[pdf]>=0.1.3"]
# 股吧反爬渲染兜底（get_community_sentiment）；未安装时直连为主，仅提示不可兜底
community = ["crawl4ai>=0.9.0"]
# P1 任务内核（backend/）；旧版 web/ 不依赖
backend = [
    "fastapi>=0.162.0,<1",
    "sqlalchemy>=2.1.6,<3",
    "alembic>=1.20.1,<2",
]

[project.scripts]
tradingagents = "cli.main:app"
tradingagents-web = "web.launch:main"

[tool.setuptools.packages.find]
include = ["tradingagents*", "cli*", "web*", "backend*"]

[tool.setuptools.package-data]
cli = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: fast isolated unit tests",
    "integration: tests requiring external services",
    "smoke: quick sanity-check tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff.lint.per-file-ignores]
# 刻意的 E402（import 顺序是功能性的，勿"修复"）：
# - cli/main.py: load_dotenv() 必须先于 langchain/tradingagents 导入（读取环境变量）
# - web/app.py: 启动性能优化，重导入刻意下沉到 set_page_config/遮罩之后
# - 各入口/工具脚本: sys.path 注入先于包导入
"cli/main.py" = ["E402"]
"web/app.py" = ["E402"]
"run_deepseek.py" = ["E402"]
"scan_sectors.py" = ["E402"]
"test_data_quality.py" = ["E402"]
"examples/*" = ["E402"]
"tools/*" = ["E402"]
"experiments/*" = ["E402"]
"scripts/*" = ["E402"]
